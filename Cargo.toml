[package]
name = "nqueens-peps-naive"
version = "0.1.0"
edition = "2024"
description = "Exact naive row-by-row sparse contraction of the N-Queens PEPS"
license = "MIT"
default-run = "nqueens-peps-naive"

[features]
default = []
cuda = []

[dependencies]
rayon = "1.10"

[[bin]]
name = "gpu_sort_reduce"
path = "src/bin/gpu_sort_reduce.rs"
required-features = ["cuda"]

[profile.release]
codegen-units = 1
lto = "thin"
